# fly.toml app configuration file generated for remart-bbs-chat on 2026-09-03T06:29:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'remart-bbs-chat'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 500
    soft_limit = 250

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
